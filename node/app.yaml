# Web-Kit's Node build, deployed to the primary account.
#
# There are no volumes: the service answers questions and returns pages, and has
# nothing worth keeping between requests.
#
# The API token is not here. It is created as a Wasmer app secret, so it stays
# out of the repository and out of this file; /healthz and /readyz are open so
# the platform can still probe the app without it.
kind: wasmer.io/App.v0
name: web-kit
owner: nexuss0781
package: .
annotations:
  anybuild.run/config:
    commands:
      start: node src/server.js
    node_install_inputs:
    - package.json
    node_package_manager: npm
    node_package_name: web-kit-node
    node_remove_native_binaries: true
    node_server: node
    npm_version: '11'
    edgejs_enable: true
    edgejs_precompile: true
    name: out
  anybuild.run/provider: node
  anybuild.run/version: 0.33.0
  wasmer.io/version: 7.5.0
app_id: da_nYYILtXU4DjZ
