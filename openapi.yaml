openapi: 3.1.0
info:
  title: Web-Kit API
  version: 0.1.0
  description: Free-first multi-provider web search and safe page fetching for Nexus Agents.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      security: []
      operationId: health
      responses:
        '200':
          description: Service is alive.
  /readyz:
    get:
      security: []
      operationId: readiness
      responses:
        '200':
          description: Service is ready.
  /v1/providers:
    get:
      operationId: listProviders
      responses:
        '200':
          description: Configured provider IDs and capabilities.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProviderInfo'
  /v1/search:
    get:
      security:
        - bearerAuth: []
      operationId: searchGet
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string, minLength: 1, maxLength: 1000 }
        - in: query
          name: providers
          schema: { type: string, example: 'searxng,duckduckgo,mojeek' }
        - in: query
          name: mode
          schema: { type: string, enum: [single, fallback, fanout], default: fanout }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
      responses:
        '200':
          description: Normalized ranked search response.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '502': { $ref: '#/components/responses/Upstream' }
    post:
      security:
        - bearerAuth: []
      operationId: searchPost
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SearchRequest' }
      responses:
        '200':
          description: Normalized ranked search response.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '502': { $ref: '#/components/responses/Upstream' }
        '503': { $ref: '#/components/responses/NoProvider' }
  /v1/fetch:
    get:
      operationId: fetchGet
      parameters:
        - in: query
          name: url
          required: true
          schema: { type: string, format: uri }
        - in: query
          name: mode
          schema: { type: string, enum: [raw, text, markdown, metadata], default: markdown }
      responses:
        '200':
          description: Normalized fetched document.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FetchResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '504': { $ref: '#/components/responses/Timeout' }
        '502': { $ref: '#/components/responses/Upstream' }
    post:
      operationId: fetchPost
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FetchRequest' }
      responses:
        '200':
          description: Normalized fetched document.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FetchResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '504': { $ref: '#/components/responses/Timeout' }
        '502': { $ref: '#/components/responses/Upstream' }
components:
  responses:
    # One definition per status, referenced from every operation that can
    # produce it, so the shape is documented once instead of drifting per
    # endpoint.
    BadRequest:
      description: An argument is missing, malformed or out of range. `E_BAD_REQUEST` or `E_BAD_JSON`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: The bearer token is absent or wrong. `E_UNAUTHORIZED`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: >-
        The request was understood and refused: robots.txt does not permit this
        path, or the URL resolves into private space. `E_ROBOTS` or `E_UNSAFE_URL`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    TooLarge:
      description: The request body is over the ceiling. `E_TOO_LARGE`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Timeout:
      description: The page did not answer in time. `E_TIMEOUT`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Upstream:
      description: >-
        The page or an upstream could not be reached, or answered in a way this
        service cannot use. A provider failing is not this: those come back in
        `warnings` with a 200, because one provider down is not a failed search.
        `E_FETCH` or `E_INTERNAL`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NoProvider:
      description: >-
        A search was asked for and this deployment has no provider enabled. Not a
        fault in the request, and 503 rather than 502 because retrying will not
        help until someone configures one. `E_NO_PROVIDER`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: No such path on this service. `E_NOT_FOUND`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    SearchRequest:
      type: object
      required: [query]
      properties:
        query: { type: string, minLength: 1, maxLength: 1000 }
        providers: { type: array, items: { type: string } }
        mode: { type: string, enum: [single, fallback, fanout], default: fanout }
        limit: { type: integer, minimum: 1, maximum: 100, default: 10 }
        language: { type: string }
        safe_search: { type: string }
        time_range: { type: string }
        domains: { type: array, items: { type: string } }
    SearchResponse:
      type: object
      required: [request_id, query, mode, results, providers, warnings, timing]
      properties:
        request_id: { type: string }
        query: { type: string }
        mode: { type: string }
        results: { type: array, items: { $ref: '#/components/schemas/SearchResult' } }
        providers: { type: object, additionalProperties: { $ref: '#/components/schemas/ProviderStatus' } }
        warnings: { type: array, items: { type: string } }
        timing: { type: object }
    SearchResult:
      type: object
      properties:
        id: { type: string }
        rank: { type: integer }
        title: { type: string }
        url: { type: string, format: uri }
        canonical_url: { type: string, format: uri, nullable: true }
        snippet: { type: string, nullable: true }
        providers: { type: array, items: { type: string } }
        provider_ranks: { type: object, additionalProperties: { type: integer } }
        score: { type: number }
    ProviderInfo:
      type: object
      properties:
        id: { type: string }
        kind: { type: string }
        enabled: { type: boolean }
        capabilities: { type: array, items: { type: string } }
    ProviderStatus:
      type: object
      properties:
        status: { type: string }
        latency_ms: { type: integer }
        result_count: { type: integer }
        error: { type: string, nullable: true }
    FetchRequest:
      type: object
      required: [url]
      properties:
        url: { type: string, format: uri }
        mode: { type: string, enum: [raw, text, markdown, metadata], default: markdown }
        render:
          type: string
          enum: [never, auto, always]
          default: never
          description: >-
            never reads the page as the server sent it. always reads it in a
            browser, which is how a page that needs its scripts run becomes
            readable. auto reads it the cheap way first and re-reads it in a
            browser only if the result looks like an empty shell. always and a
            successful auto need FIRECRAWL_API_KEY; without it the page is
            returned unread and a warning says so.
        timeout_ms: { type: integer, maximum: 12000 }
        max_bytes: { type: integer, maximum: 5242880 }
        follow_redirects: { type: boolean, default: true }
        respect_robots: { type: boolean, default: true }
        include_links: { type: boolean, default: true }
        include_images: { type: boolean, default: false }
    FetchResponse:
      type: object
      properties:
        request_id: { type: string }
        retrieval: { type: object }
        document: { type: object }
        warnings: { type: array, items: { type: string } }
        timing: { type: object }
    ErrorResponse:
      type: object
      description: >-
        Every failure has this shape, so a caller can read one without knowing
        which of the endpoints it called. `request_id` is also in the log, so a
        report can be tied to what actually happened.
      required: [error, request_id]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: >-
                Stable across releases and safe to branch on. The `E_*` codes
                below are the whole vocabulary; anything else is a fault this
                service did not anticipate.
              enum:
                - E_BAD_REQUEST     # missing or malformed argument
                - E_BAD_JSON        # body was not parseable as JSON
                - E_UNSAFE_URL      # refused: private address, bad scheme, unexpected port
                - E_ROBOTS          # robots.txt does not permit this path
                - E_NOT_FOUND       # no such path on this service
                - E_NO_PROVIDER     # a search was asked for and no provider is configured
                - E_TOO_LARGE       # request body over the ceiling
                - E_UNAUTHORIZED    # missing or wrong bearer token
                - E_TIMEOUT         # the page or an upstream did not answer in time
                - E_FETCH           # the page could not be fetched
                - E_INTERNAL        # a fault here, not a mistake by the caller
            message:
              type: string
              description: >-
                Readable, and specific for anything the caller can fix. A 5xx
                says only "the request could not be completed", because the
                detail belongs in the log and not in front of whoever is asking.
        request_id: { type: string }
